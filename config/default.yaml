table:
  # Playing surface (inside cushions), millimeters
  width_mm: 1270.0   # 50" bar table example; 9ft = 2540 x 1270
  length_mm: 2540.0
  ball_diameter_mm: 57.15
  ball_radius_mm: 28.575

vision:
  # ball detector: classical (Hough) | yolo (needs pip install -e ".[yolo]")
  detector: classical
  yolo_model: yolov8n.pt
  yolo_confidence: 0.35
  yolo_class_ids: [32]
  # Playing surface color (red refelt). Tune with pool-fool-calibrate felt-sample
  felt_color: red
  felt_hsv_red:
    ranges:
      - low: [0, 80, 50]
        high: [12, 255, 255]
      - low: [168, 80, 50]
        high: [180, 255, 255]
  # Legacy presets (unused when felt_color: red)
  felt_hsv_green:
    low: [35, 40, 40]
    high: [85, 255, 255]
  felt_hsv_blue:
    low: [90, 40, 40]
    high: [130, 255, 255]
  cue_ball_min_brightness: 180
  hough_dp: 1.2
  hough_min_dist_px: 25
  hough_param1: 80
  hough_param2: 28
  min_ball_radius_px: 8
  max_ball_radius_px: 40
  ball_tracker_alpha: 0.35
  stationary_velocity_mm_s: 25.0
  stationary_frames_required: 5
  aim_angle_threshold_deg: 12.0
  cue_hough_threshold: 60
  cue_min_line_length_px: 80
  cue_max_line_gap_px: 15

overlay:
  line_color_bgr: [0, 255, 200]
  ghost_ball_color_bgr: [0, 180, 255]
  line_thickness_px: 3
  ghost_ball_radius_px: 12

network:
  stream_host: "0.0.0.0"
  stream_port: 8554
  stream_path: "/pool"
  overlay_udp_host: "192.168.1.100"  # Pi IP
  overlay_udp_port: 8765
  desktop_bind_host: "0.0.0.0"
  desktop_overlay_port: 8765

paths:
  table_homography: "config/calibration/table_homography.npz"
  projector_homography: "config/calibration/projector_homography.npz"
  lens_calibration: "config/calibration/lens.npz"
  play_region: "config/calibration/play_region.npz"
  camera_exposure: "config/calibration/camera_exposure.yaml"

calibration:
  # When the full table is not in frame, use partial region (see calibrate --region)
  region: full

cameras:
  overhead_index: 0
  # side_index: 1   # corner mount ~30-45°, sees cue stick along the table (not end-on)
  undistort: false   # set true only after a good lens-aruco cal; bad cal makes fisheye worse
  width: 1280
  height: 720
  fps: 30
  manual_exposure: true
  exposure: -6
  # Digital zoom (Logitech etc.): 0 = widest, higher = tighter crop
  zoom: 0
  # Used by: pool-fool-calibrate capture --wide
  wide_width: 640
  wide_height: 480
  wide_zoom: 0


projector:
  display_width: 1920
  display_height: 1080
