table:
  # Playing surface (inside cushions), millimeters
  width_mm: 1270.0   # 50" bar table example; 9ft = 2540 x 1270
  length_mm: 2540.0
  ball_diameter_mm: 57.15
  ball_radius_mm: 28.575

vision:
  # YOLO-only ball detection (pip install -e ".[yolo]")
  yolo_model: yolov8n.pt
  yolo_confidence: 0.22
  yolo_class_ids: [32]   # COCO 32 = sports ball
  yolo_imgsz: 640
  yolo_iou: 0.55
  yolo_max_det: 16
  yolo_frame_stride: 2       # run inference every N frames; tracker holds between
  yolo_clahe: true           # contrast boost for red felt / white balls
  yolo_cluster_merge_mm: 55  # merge jittery duplicate boxes
  yolo_cue_min_brightness: 140
  ball_tracker_alpha: 0.12   # lower = smoother (less jitter)
  ball_tracker_match_gate_mm: 100.0
  stationary_velocity_mm_s: 50.0
  stationary_frames_required: 8
  stationary_velocity_ema_alpha: 0.2
  aim_angle_threshold_deg: 12.0
  use_cue_line: false          # no classical cue Hough; enable if you add a side cam
  aim_mode: cue_to_object      # ghost line cue→nearest object when 2+ balls

overlay:
  line_color_bgr: [0, 255, 200]
  ghost_ball_color_bgr: [0, 180, 255]
  line_thickness_px: 3
  ghost_ball_radius_px: 12

network:
  stream_host: "0.0.0.0"
  stream_port: 8554
  stream_path: "/pool"
  overlay_udp_host: "pool.local"  # Pi mDNS hostname; or IP from `hostname -I` on the Pi
  overlay_udp_port: 8765
  desktop_bind_host: "0.0.0.0"
  desktop_overlay_port: 8765

paths:
  table_homography: "config/calibration/table_homography.npz"
  projector_homography: "config/calibration/projector_homography.npz"
  lens_calibration: "config/calibration/lens.npz"
  play_region: "config/calibration/play_region.npz"
  camera_exposure: "config/calibration/camera_exposure.yaml"

calibration:
  region: full

cameras:
  overhead_index: 0
  undistort: false
  width: 1280
  height: 720
  fps: 30
  manual_exposure: true
  exposure: -6
  zoom: 0
  wide_width: 640
  wide_height: 480
  wide_zoom: 0

projector:
  display_width: 1920
  display_height: 1080
